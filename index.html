<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModelRadar · 菜单栏视图（网页仿制）</title>
<style>
  :root{
    --ink:#1d1d1f; --dim:#6b6b70; --card:#f6f6f7; --line:rgba(0,0,0,.08);
    --bar:rgba(250,250,252,.72); --shadow:0 18px 48px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.12);
    --nat-w:748px;
  }
  @media (prefers-color-scheme:dark){
    :root{ --ink:#f2f2f4; --dim:#9a9aa2; --card:#1e1e20; --line:rgba(255,255,255,.12);
           --bar:rgba(28,28,30,.72); --shadow:0 18px 48px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4); }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  /* 页面本身不滚：所有尺寸由窗口决定，内容按比例缩放进弹层 */
  body{
    margin:0; color:var(--ink); font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
    background:radial-gradient(120% 90% at 20% 0%,#dbe7ff 0%,#eef1f6 42%,#e7e2da 100%);
    height:100dvh; overflow:hidden;
  }
  @media (prefers-color-scheme:dark){
    body{background:radial-gradient(120% 90% at 20% 0%,#1d2a44 0%,#14161b 45%,#1a1712 100%)}
  }
  .bar{
    position:fixed; inset:0 0 auto 0; height:28px; display:flex; align-items:center; gap:14px;
    padding:0 12px; background:var(--bar); backdrop-filter:saturate(180%) blur(18px);
    -webkit-backdrop-filter:saturate(180%) blur(18px); border-bottom:1px solid var(--line); z-index:10;
  }
  .bar .spacer{flex:1}
  .bar .glyph{opacity:.75; font-size:12px; letter-spacing:.2px; white-space:nowrap}
  .item{
    position:relative; width:30px; height:22px; display:grid; place-items:center; cursor:default;
    border:0; padding:0; background:transparent; color:var(--ink); border-radius:6px; flex:none;
  }
  .item:hover,.item[aria-expanded="true"]{background:rgba(127,127,127,.22)}
  .dot{
    position:absolute; top:2px; right:3px; width:7px; height:7px; border-radius:50%;
    background:#ff453a; box-shadow:0 0 0 1.5px var(--bar); opacity:0; transform:scale(.6);
    transition:opacity .18s ease,transform .18s ease;
  }
  .dot.on{opacity:1; transform:scale(1)}
  /* 弹层：宽高都由 compute() 按窗口与内容算好写死，内部不再出现滚动条 */
  .pop{
    position:fixed; top:34px; right:12px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; box-shadow:var(--shadow); display:none; flex-direction:column;
    overflow:hidden; z-index:20; max-width:calc(100vw - 24px);
  }
  .pop.open{display:flex; animation:pop .16s ease-out; transform-origin:top right}
  @keyframes pop{from{opacity:0; transform:translateY(-6px) scale(.98)} to{opacity:1; transform:none}}
  .pop::before{
    content:""; position:absolute; top:-6px; right:22px; width:12px; height:12px; background:var(--card);
    border-left:1px solid var(--line); border-top:1px solid var(--line); transform:rotate(45deg);
  }
  .stage{position:relative; overflow:hidden; flex:none}
  /* iframe 永远按外壳的逻辑尺寸排版（748 宽），再整体缩放，图内不重排也不滚动 */
  .stage iframe{
    display:block; border:0; width:748px; height:600px; background:transparent;
    transform-origin:top left;
  }
  .tools{
    display:flex; align-items:center; gap:6px; padding:7px 10px; border-top:1px solid var(--line);
    background:color-mix(in srgb,var(--card) 92%,var(--ink) 8%); flex:none; overflow:hidden;
  }
  .tools button{
    font:12px/1 inherit; padding:5px 9px; border-radius:6px; border:1px solid var(--line);
    background:transparent; color:var(--dim); cursor:not-allowed; white-space:nowrap;
  }
  .tools .note{margin-left:auto; font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .tools .note a{color:inherit; text-underline-offset:2px}
  .closed-tip{
    position:fixed; top:34px; right:12px; padding:8px 11px; border-radius:9px; background:var(--bar);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line);
    color:var(--dim); font-size:12px; z-index:6;
  }
  @media (max-width:620px){
    .bar .glyph.opt{display:none}
    .tools .note{display:none}
  }
</style>

<nav class="bar" aria-label="菜单栏（仿制）">
  <span class="glyph">ModelRadar</span>
  <span class="glyph opt">状态栏视图</span>
  <span class="spacer"></span>
  <span class="glyph opt">100%</span>
  <button class="item" id="status" aria-expanded="false" aria-controls="pop" title="ModelRadar · 有未读（点开查看）">
    <!-- 图标照外壳自绘的六个气泡随笔（ChartWidget.swift getStatusImage），不是雷达弧线 -->
    <svg width="18" height="18" viewBox="0 0 22 22" aria-hidden="true" fill="currentColor">
      <circle cx="3" cy="16.5" r="2.3"/>
      <circle cx="8" cy="18" r="1.8"/>
      <circle cx="13" cy="6" r="2.6"/>
      <circle cx="17.5" cy="12" r="2"/>
      <circle cx="11" cy="13.5" r="3"/>
      <circle cx="5.5" cy="9" r="1.6"/>
    </svg>
    <span class="dot" id="dot" aria-hidden="true"></span>
  </button>
  <span class="glyph" id="clock">--:--</span>
</nav>

<div class="pop" id="pop" role="dialog" aria-label="ModelRadar 弹层">
  <div class="stage" id="stage"><iframe id="frame" title="ModelRadar 定位图" src="data/chart.html"></iframe></div>
  <div class="tools" id="tools">
    <span id="changes" aria-live="polite">正在读取数据…</span>
    <span class="note">网页仿制 · 本地动作仅在 macOS 应用里可用 · <a href="data/chart.html">原件</a></span>
  </div>
</div>

<div class="closed-tip" id="tip">点菜单栏右侧的图标展开</div>

<script>
(function(){
  var btn = document.getElementById('status'),
      pop = document.getElementById('pop'),
      stage = document.getElementById('stage'),
      frame = document.getElementById('frame'),
      tools = document.getElementById('tools'),
      dot = document.getElementById('dot'),
      tip = document.getElementById('tip'),
      clock = document.getElementById('clock');

  var NAT_W = 748, TOP = 34, GAP = 12;

  function tick(){
    var d = new Date();
    clock.textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  tick(); setInterval(tick, 15000);

  // 内容真高：iframe 始终按 748 排版，不受窗口影响，所以量一次可复用；数据换图后重量。
  function measureContent(){
    var d = null;
    try { d = frame.contentDocument; } catch (err) { return 0; }
    if (!d || !d.body) return 0;
    var bottom = 0, kids = d.body.children;
    for (var i = 0; i < kids.length; i++) {
      var r = kids[i].getBoundingClientRect();
      if (r.height <= 0) continue;
      var mb = parseFloat(getComputedStyle(kids[i]).marginBottom) || 0;
      bottom = Math.max(bottom, r.bottom + mb);
    }
    var pad = parseFloat(getComputedStyle(d.body).paddingBottom) || 0;
    return Math.ceil(bottom + pad);
  }

  // 页面不滚：弹层整体缩放到窗口内。k 同时受宽度与高度约束，图内不出现滚动条。
  function layout(){
    if (!pop.classList.contains('open')) return;
    var contentH = measureContent() || 600;
    var toolsH = tools.offsetHeight || 34;
    var availW = Math.min(NAT_W, window.innerWidth - 2 * GAP);
    var availH = Math.max(120, window.innerHeight - TOP - GAP - toolsH);
    var k = Math.min(1, availW / NAT_W, availH / contentH);
    frame.style.height = contentH + 'px';
    frame.style.transform = 'scale(' + k + ')';
    stage.style.width = Math.round(NAT_W * k) + 'px';
    stage.style.height = Math.round(contentH * k) + 'px';
    pop.style.width = Math.round(NAT_W * k) + 'px';
  }

  function open(){
    if (pop.classList.contains('open')) return;
    pop.classList.add('open');
    btn.setAttribute('aria-expanded','true');
    tip.hidden = true;
    dot.classList.remove('on');     // 点开即视为已读，消掉角标（与外壳一致）
    layout();
    if (currentSnapshot) {
      showSnapshot(currentSnapshot);
    }
  }
  function close(){
    pop.classList.remove('open');
    btn.setAttribute('aria-expanded','false');
  }
  function toggle(){ pop.classList.contains('open') ? close() : open(); }

  btn.addEventListener('click', function(e){ e.stopPropagation(); toggle(); });
  document.addEventListener('click', function(e){
    if (pop.classList.contains('open') && !pop.contains(e.target) && !btn.contains(e.target)) close();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowDown' && e.metaKey) open();
  });
  window.addEventListener('resize', layout);
  frame.addEventListener('load', function(){ if (pop.classList.contains('open')) layout(); });
  setInterval(function(){ if (pop.classList.contains('open')) layout(); }, 1500);  // 换图后高度会变

  // 角标只在“有比上次看过的更新”时亮，和外壳语义一致；没证据就不亮。
  var seenKey = 'mr.seen.snapshot.v1', currentSnapshot = null;
  var changes = document.getElementById('changes');
  function markSeen(snapshot){
    try { if (snapshot) localStorage.setItem(seenKey, JSON.stringify(snapshot)); }
    catch (err) { changes.textContent = '浏览器存储不可用，无法保存上次查看记录'; }
  }
  function showSnapshot(snapshot){
    frame.onload = function(){
      layout();
      try {
        var stamp = frame.contentDocument.querySelector('.foot .tip b');
        if (currentSnapshot === snapshot && pop.classList.contains('open') &&
            stamp && stamp.textContent.trim() === snapshot.last) markSeen(snapshot);
        else changes.textContent = '图表和数据时间不一致，未更新查看记录';
      } catch (err) { changes.textContent = '无法验证图表，未更新查看记录'; }
    };
    frame.src = 'data/chart.html?v=' + encodeURIComponent(snapshot.last);
  }
  function checkUnread(){
    fetch('data/latest.json', {cache:'no-store'}).then(function(r){
      return r.ok ? r.json() : null;
    }).then(function(d){
      if (!d || !d.generated_at || d.data_state !== 'ok' || !Array.isArray(d.models) || !d.models.length) {
        changes.textContent = '暂无可比较的新鲜数据'; return;
      }
      if (currentSnapshot && currentSnapshot.last === d.generated_at) return;
      if (!d.content_hash) { changes.textContent = '数据缺少内容指纹，无法比较'; return; }
      var snapshot = {first:d.generated_at, last:d.generated_at, hash:d.content_hash, version:d.evaluation_version, models:{}};
      d.models.forEach(function(m){
        if (m.name) snapshot.models[m.name] = {index:m.index, apt_usd:m.apt_usd};
      });
      var seen;
      try { seen = JSON.parse(localStorage.getItem(seenKey) || 'null'); }
      catch (err) { changes.textContent = '浏览器存储不可用，无法保存上次查看记录'; return; }
      var same = seen && seen.hash === snapshot.hash;
      if (same) snapshot.first = seen.first || seen.last;
      currentSnapshot = snapshot;
      if (!seen || !seen.models) changes.textContent = '首次查看：已建立本浏览器的对比基准';
      else if (same) changes.textContent = '相同快照：' + snapshot.first + ' 至 ' + snapshot.last;
      else if (!seen.version || !snapshot.version || seen.version !== snapshot.version)
        changes.textContent = '评测版本不同或未知，不比较指标';
      else {
        var changed = Object.keys(snapshot.models).filter(function(name){
          var a = seen.models[name], b = snapshot.models[name];
          return a && ['index','apt_usd'].some(function(k){
            return typeof a[k] === 'number' && typeof b[k] === 'number' && a[k] !== b[k];
          });
        });
        changes.textContent = '自上次查看 ' + seen.last + '：' + changed.length + ' 个模型指标变化';
      }
      if (pop.classList.contains('open')) {
        showSnapshot(snapshot);
      } else if (seen && !same) dot.classList.add('on');
    }).catch(function(){ changes.textContent = '无法读取最新数据'; });
  }

  checkUnread();
  setInterval(checkUnread, 60000);
  open();                            // 本页目的就是看这个弹层，进来先展开
})();
</script>
</html>
