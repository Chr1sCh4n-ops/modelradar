name: Deploy ModelRadar Window

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/6 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      MODELRADAR_SUPPORT: ${{ github.workspace }}/.state
      MODELRADAR_DATA_DIR: ${{ github.workspace }}/.state/data
      MODELRADAR_REPO_DATA: ${{ github.workspace }}/data
      MR_FETCH_PROXY: "off"
      MODELRADAR_NO_SUMMARY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet -r requirements.txt

      - name: Test history and chart rendering
        run: .venv/bin/python -B -m unittest discover -s tests

      - name: Refresh public data
        run: |
          previous="$RUNNER_TEMP/modelradar-previous.json"
          status=$(curl --silent --show-error --max-time 25 --retry 2 --output "$previous" --write-out '%{http_code}' \
            "https://chr1sch4n-ops.github.io/modelradar/data/latest.json?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          args=()
          case "$status" in
            200) args=(--carry-from "$previous") ;;
            404) ;; # First deployment has no predecessor.
            *) echo "Cannot read the previous Pages snapshot: HTTP $status"; exit 1 ;;
          esac
          .venv/bin/python fetch_model_data.py \
            "${args[@]}" \
            --sources aa,aa_progress,aa_times,openrouter,models_dev,datalearner,openrouter_usage
          .venv/bin/python -c 'import json, os; d=json.load(open(os.path.join(os.environ["MODELRADAR_DATA_DIR"], "latest.json"))); assert d.get("data_state") == "ok" and d.get("models"), "Fresh complete data is required"'
          .venv/bin/python render_scatter_svg.py -o data/chart.html

      - name: Assemble Pages artifact
        run: |
          mkdir -p public/data
          cp index.html public/index.html
          cp data/chart.html public/data/chart.html
          cp data/latest.js public/data/latest.js
          cp "$MODELRADAR_DATA_DIR/latest.json" public/data/latest.json

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
