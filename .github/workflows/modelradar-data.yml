name: modelradar-data

on:
  schedule:
    # 09:17 Asia/Shanghai after the AA daily leaderboard update.
    - cron: "17 1 * * *"
  workflow_dispatch:

concurrency:
  group: modelradar-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Free path: use the leaderboard inline time data, never start Chrome.
      MODELRADAR_NO_HEADLESS: "1"
      MODELRADAR_NO_SUMMARY: "1"
      MR_HUB_NOTIFY: ""
      MODELRADAR_DATA_DIR: ${{ github.workspace }}/data
      MODELRADAR_SUPPORT: ${{ github.workspace }}/support
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawl all sources
        run: >-
          python fetch_model_data.py
          --sources aa,aa_progress,aa_times,openrouter,openrouter_usage,models_dev,datalearner
          --no-logos
      - name: Commit data
        run: |
          git config user.name "modelradar-bot"
          git config user.email "modelradar-bot@users.noreply.github.com"
          git add data/latest.json data/latest.js data/logos progress_v1_baseline.json progress_v1_model.json 2>/dev/null || true
          git add data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no data change"
            exit 0
          fi
          git commit -m "Update ModelRadar data: $(date -u +%FT%TZ)"
          git push
